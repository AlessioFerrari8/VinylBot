server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # asset con hash nel nome (outputHashing: all) possono essere cachati a lungo
    location ~ "\.[0-9a-f]{8,}\.(js|css)$" {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # SPA: qualunque path non trovato ricade su index.html, il router di Angular
    # gestisce /docs, /status, ecc. lato client
    location / {
        try_files $uri $uri/ /index.html;
    }
}
